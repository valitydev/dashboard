<div
    [ngClass]="{ 'dsh-accordion-item-expanded': expanded }"
    class="dsh-accordion-item"
    (click)="expand()"
>
    @if (expandedChange | async) {
        <div @expand class="dsh-accordion-item-content">
            <ng-container
                *ngTemplateOutlet="accordionItemContent?.templateRef || lazyContent?._template"
            ></ng-container>
        </div>
    } @else {
        <div @expand>
            <ng-content></ng-content>
        </div>
    }
</div>
