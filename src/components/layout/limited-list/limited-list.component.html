<div
    *transloco="let t; scope: 'components'; prefix: 'components.shared'"
    fxLayout="column"
    fxLayoutGap="8px"
>
    <div class="mat-title-small dsh-limited-list-title">{{ title }}</div>
    <ng-content></ng-content>
    @if (!displayedAll && contentChildren?.length > displayedCount) {
        <div class="dsh-limited-list-show-more mat-body-small" (click)="showMore()">
            {{ t('showMore') }}
        </div>
    }
</div>
