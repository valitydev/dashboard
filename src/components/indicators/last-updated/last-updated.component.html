<div
    *transloco="let t; scope: 'components'; prefix: 'components.lastUpdated'"
    class="dsh-last-updated"
    dir="rtl"
    fxLayout
    fxLayoutAlign="space-between center"
>
    @if (lastUpdated) {
        <a class="dsh-last-updated-update-link" (click)="update.emit()">{{ t('update') }}</a>
        <span>
            {{ t('lastUpdate') }}:
            {{ lastUpdated | humanizedDuration: { largest: 1, hasAgoEnding: true } }}
        </span>
    }
</div>
