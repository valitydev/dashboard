<div class="base-dialog" fxFlex="grow" fxLayout="column" fxLayoutGap="24px">
    <div class="base-dialog-title">
        <div [dshNoContent]="titleBlock">
            <ng-content select="dshBaseDialogTitle"></ng-content>
            <ng-content select="[dshBaseDialogTitle]"></ng-content>
        </div>
    </div>
    <ng-container *ngTemplateOutlet="contentDividerContent"></ng-container>
    <div [dshNoContent]="noContent" class="base-dialog-content">
        <ng-content></ng-content>
    </div>
    @if (!noActions) {
        <ng-container *ngTemplateOutlet="contentDividerContent"></ng-container>
        <dsh-actions>
            <ng-content select="dshBaseDialogActions"></ng-content>
            <ng-content select="[dshBaseDialogActions]"></ng-content>
        </dsh-actions>
    }
</div>

<ng-template #contentDividerContent>
    @if (hasDivider) {
        <mat-divider></mat-divider>
    }
</ng-template>

<ng-template #noContent></ng-template>

<ng-template #titleBlock>
    <div fxLayout="row" fxLayoutAlign="space-between">
        <div fxLayout="column" fxLayoutGap="16px">
            <div class="mat-headline-small">{{ title }}</div>
            @if (subtitle) {
                <div class="mat-body-medium">{{ subtitle }}</div>
            }
        </div>
        <dsh-bi
            class="base-dialog-title-close"
            icon="x"
            size="lg"
            (click)="cancelDialog()"
        ></dsh-bi>
    </div>
</ng-template>
