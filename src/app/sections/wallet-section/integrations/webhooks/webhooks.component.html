<div
    *transloco="let t; scope: 'wallet-section'; prefix: 'walletSection.webhooks'"
    fxLayout="column"
    fxLayoutGap="32px"
>
    <div
        fxLayout="row"
        fxLayout.lt-md="column"
        fxLayoutAlign="end"
        fxLayoutAlign.lt-md="center stretch"
        fxLayoutGap="24px"
    >
        <button mat-flat-button (click)="createWebhook()">{{ t('create') }}</button>
    </div>

    @if ((isLoading$ | async) || !(webhooks$ | async)) {
        <div fxFlexAlign="center" fxLayout>
            <dsh-spinner></dsh-spinner>
        </div>
    } @else {
        <dsh-webhooks-list
            [expandedId]="expandedId$ | async"
            [lastUpdated]="lastUpdated$ | async"
            [webhooks]="webhooks$ | async"
            (expandedIdChange)="expandedIdChange($event)"
            (refreshData)="receiveWebhooks()"
        ></dsh-webhooks-list>
        @if ((webhooks$ | async)?.length === 0) {
            <dsh-empty-search-result [text]="t('emptyResult')"></dsh-empty-search-result>
        }
    }
</div>
