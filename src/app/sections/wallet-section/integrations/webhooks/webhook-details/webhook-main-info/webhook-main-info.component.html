<div
    *transloco="let t; scope: 'wallet-section'; prefix: 'walletSection.webhooks.details'"
    class="dsh-webhook-panel-details-section"
    fxLayout="column"
    fxLayoutGap="24px"
>
    <dsh-details-item [title]="t('url')">
        <div class="mat-body-medium">
            {{ url }}
        </div>
    </dsh-details-item>
    @if (walletName) {
        <dsh-details-item [title]="t('wallet')">
            <div class="mat-body-medium">
                {{ walletName }}
            </div>
        </dsh-details-item>
    }
</div>
