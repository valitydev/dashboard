<div
    *transloco="let t; scope: 'wallet-section'; prefix: 'walletSection.wallets'"
    class="dsh-wallets"
    fxLayout="column"
    fxLayoutGap="32px"
>
    <dsh-wallets-list
        [expandedId]="expandedId$ | async"
        [lastUpdated]="lastUpdated$ | async"
        [wallets]="wallets$ | async"
        (expandedIdChange)="expandedIdChange($event)"
        (refreshData)="refresh()"
    ></dsh-wallets-list>
    @if (!(wallets$ | async)?.length && (isLoading$ | async) === false) {
        <dsh-empty-search-result [text]="t('emptyResult')"></dsh-empty-search-result>
    }
    @if (hasMore$ | async) {
        <dsh-show-more-panel [isLoading]="isLoading$ | async" (showMore)="fetchMore()">
        </dsh-show-more-panel>
    }
    @if (isLoading$ | async) {
        <div fxFlexAlign="center" fxLayout>
            <dsh-spinner></dsh-spinner>
        </div>
    }
</div>
<dsh-scroll-up></dsh-scroll-up>
