<div
    *transloco="let t; scope: 'wallet-section'; prefix: 'walletSection.wallets.mainInfo'"
    gdAlignColumns="start center"
    gdColumns="1fr"
    gdColumns.gt-sm="1fr 1fr 1fr"
    gdGap="24px"
>
    <div gdColumn.md="1/4">
        @if (walletAccount$ | async; as account) {
            <div class="mat-headline-small">
                {{ account.available.amount | amountCurrency: account.available.currency }}
            </div>
        } @else {
            <ng-template
                [ngTemplateOutlet]="(isLoading$ | async) ? loading : error ? error : null"
            ></ng-template>
        }
    </div>
    <ng-template #loading>
        <dsh-spinner size="30"></dsh-spinner>
    </ng-template>
    <ng-template #error>
        <div class="mat-body-medium">{{ t('fetchWalletAccountError') }}</div>
    </ng-template>
    <dsh-details-item [title]="t('name')" gdColumn.md="1/3">{{ wallet.name }}</dsh-details-item>
</div>
