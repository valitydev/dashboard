<div
    *transloco="let t; scope: 'wallet-section'; prefix: 'walletSection.wallets.walletDeposits'"
    fxLayout="column"
    fxLayoutGap="24px"
>
    <div class="mat-title-large">{{ t('title') }}</div>
    <ng-container *ngFor="let deposit of deposits$ | async as deposits; index as i">
        <dsh-wallet-deposit-details [deposit]="deposit"></dsh-wallet-deposit-details>
        @if (i < deposits.length - 1) {
            <mat-divider></mat-divider>
        }
    </ng-container>
    @if (isLoading$ | async) {
        <div>
            <ng-container *transloco="let c; scope: 'components'; prefix: 'components.shared'">
                {{ c('loading') }}
            </ng-container>
        </div>
    }
    @if (errors$ | async) {
        <div>
            <ng-container *transloco="let c; scope: 'components'; prefix: 'components.shared'">
                {{ t('fetchError') }}
            </ng-container>
        </div>
    }
    @if ((hasMore$ | async) && (isLoading$ | async) === false && !(errors$ | async)) {
        <button mat-flat-button (click)="fetchMore()">
            <ng-container *transloco="let c; scope: 'components'; prefix: 'components.shared'">
                {{ c('showMore') }}
            </ng-container>
        </button>
    }
</div>
