<ng-container
    *transloco="let t; scope: 'wallet-section'; prefix: 'walletSection.withdrawals.filters'"
>
    <div fxLayout="column" fxLayoutGap="16px">
        <div class="mat-title-large" fxFlex>{{ t('status') }}</div>
        <dsh-expandable-radio-group [choices]="statuses" [control]="control" anyResponse fxFlex>
            @for (status of statuses; track status) {
                <ng-template [dshExpandableRadioGroupItem]="status">
                    <span>{{ (withdrawalStatusDict$ | async)?.[status] }}</span>
                </ng-template>
            }
        </dsh-expandable-radio-group>
    </div>
</ng-container>
