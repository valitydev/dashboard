<div
    *transloco="let t; scope: 'organization-section'; prefix: 'organizationSection.organization'"
    fxLayout="column"
    fxLayoutGap="24px"
>
    <div class="mat-headline-small">{{ organization?.name }}</div>

    <dsh-details-item [title]="t('numberOfEmployees')">
        {{ membersCount$ | async }}
    </dsh-details-item>

    @if (member$ | async; as member) {
        <mat-divider></mat-divider>
        <div class="mat-title-large">{{ t('titles.roles') }}</div>
        <dsh-organization-roles
            [isOwner]="isOwner$ | async"
            [roles]="member.roles"
        ></dsh-organization-roles>
    }

    <mat-divider></mat-divider>
    <div class="mat-title-large">{{ t('titles.actions') }}</div>
    <div fxLayout fxLayoutGap="24px">
        @if (hasAdminAccess$ | async) {
            <button mat-flat-button (click)="rename()">
                {{ t('actions.rename') }}
            </button>
        }
        @if ((isOwner$ | async) === false) {
            <button class="matv-error" mat-flat-button (click)="leave()">
                {{ t('actions.leave') }}
            </button>
        }
    </div>

    @if (hasAdminAccess$ | async) {
        <mat-divider></mat-divider>
        <dsh-navigation-link
            [routerLink]="['/', 'organization-section', 'organizations', organization.id]"
            [text]="t('management')"
            fxFlexAlign="end"
        ></dsh-navigation-link>
    }
</div>
