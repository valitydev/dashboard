<dsh-base-dialog
    *transloco="
        let t;
        scope: 'organization-section';
        prefix: 'organizationSection.selectRoleDialog'
    "
    [noActions]="dialogData.isShow"
    [title]="t('title')"
    (cancel)="cancel()"
>
    <div class="content">
        <dsh-nested-table
            [cellsTemplates]="cellsTemplates"
            [columns]="columns$ | async"
            [data]="data"
        >
            <ng-template #accessCellTpl let-column="column" let-index="index" let-value="value">
                @if (value && $safeNavigationMigration(value?.availableRoles) !== undefined) {
                    <dsh-selection
                        [selected]="
                            $safeNavigationMigration(
                                value?.availableRoles?.includes?.(column.field)
                            )
                        "
                        class="selection"
                    ></dsh-selection>
                }
                @if (!value && index === 0) {
                    <div class="selection">
                        <mat-radio-group
                            [disabled]="
                                !dialogData.availableRoles.includes(
                                    $safeNavigationMigration(column?.field)
                                )
                            "
                            [ngModel]="selectedRole$ | async"
                            (ngModelChange)="selectedRole$.next(column.field)"
                        >
                            <mat-radio-button [value]="column.field"></mat-radio-button>
                        </mat-radio-group>
                    </div>
                }
            </ng-template>
        </dsh-nested-table>
    </div>
    @if (!dialogData.isShow) {
        <ng-container dshBaseDialogActions>
            <button [disabled]="!(selectedRole$ | async)" mat-flat-button (click)="select()">
                {{ t('select') }}
            </button>
        </ng-container>
    }
</dsh-base-dialog>
