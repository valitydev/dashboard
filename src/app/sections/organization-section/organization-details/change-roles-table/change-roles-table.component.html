<div
    *transloco="
        let t;
        scope: 'organization-section';
        prefix: 'organizationSection.changeRolesTable'
    "
    class="wrapper"
>
    <span
        class="dsh-text-color-secondary mat-body-medium"
        style="text-decoration: underline; cursor: pointer"
        (click)="show()"
        >{{ t('info') }}</span
    >
    <dsh-nested-table
        [cellsTemplates]="cellsTemplates"
        [columns]="columns$ | async"
        [data]="data$ | async"
        [footerTemplates]="footerTemplates"
        [headersTemplates]="{ add: headerTpl }"
    >
        <ng-template #headerTpl let-column="column">
            <button mat-flat-button (click)="add()">{{ t('add') }}</button>
        </ng-template>
        <ng-template #roleCellTpl let-column="column" let-value="value">
            @if (value?.scope !== 'Wallet' && column.field !== 'WalletManager') {
                <mat-checkbox
                    [checked]="
                        checked(
                            column.field,
                            $safeNavigationMigration(value?.shop?.id),
                            $safeNavigationMigration(value?.scope)
                        ) | async
                    "
                    [disabled]="
                        (disabled(
                            column.field,
                            $safeNavigationMigration(value?.shop?.id),
                            $safeNavigationMigration(value?.scope)
                        ) | async) || inProgress
                    "
                    [indeterminate]="
                        value?.shop || value?.scope === 'Wallet'
                            ? false
                            : (isIntermediate(column.field) | async)
                    "
                    (change)="
                        toggle(
                            column.field,
                            $safeNavigationMigration(value?.shop?.id),
                            $event.checked
                        )
                    "
                ></mat-checkbox>
            } @else {
                <dsh-selection
                    [selected]="
                        checked(
                            column.field,
                            $safeNavigationMigration(value?.shop?.id),
                            $safeNavigationMigration(value?.scope)
                        ) | async
                    "
                    class="selection"
                ></dsh-selection>
            }
            <ng-template #selectedTpl>
                <dsh-selection
                    [selected]="
                        checked(
                            column.field,
                            $safeNavigationMigration(value?.shop?.id),
                            $safeNavigationMigration(value?.scope)
                        ) | async
                    "
                    class="selection"
                ></dsh-selection>
            </ng-template>
        </ng-template>
        <ng-template #footerCellTpl let-column="column" let-value="value">
            <button
                [disabled]="
                    !(isAllowRemove($safeNavigationMigration(column?.field)) | async) || inProgress
                "
                class="matv-error"
                mat-flat-button
                (click)="remove(column.field)"
            >
                {{ t('remove') }}
            </button>
        </ng-template>
    </dsh-nested-table>
</div>
