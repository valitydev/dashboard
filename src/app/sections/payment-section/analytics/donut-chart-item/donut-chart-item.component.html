<dsh-card
    *transloco="let c; scope: 'components'; prefix: 'components.shared'"
    style="display: flex; flex-direction: column; gap: 16px"
>
    <dsh-card-title fxLayoutAlign="space-between">
        <div class="mat-title-large">{{ title }}</div>
        @if (isLoading) {
            <dsh-spinner [type]="spinnerType" size="28"></dsh-spinner>
        }
    </dsh-card-title>
    <dsh-card-content
        *transloco="let t; scope: 'payment-section'; prefix: 'paymentSection.analytics'"
        fxFlexFill
    >
        @if (!error) {
            <div fxFlex fxFlexFill>
                <div fxFlexFill>
                    @if (selectedErrorTitle) {
                        <div fxLayout fxLayoutAlign="start center" fxLayoutGap="10px">
                            <dsh-bi
                                class="back-selection-icon"
                                icon="arrow-left"
                                size="sm"
                                (click)="goBackDataSelection()"
                            ></dsh-bi>
                            <div class="mat-body-small">{{ selectedErrorTitle }}</div>
                        </div>
                    }
                    @if (selectedErrorTitle && chartData?.series?.length === 0) {
                        <div>
                            <dsh-donut-chart
                                [colors]="colors"
                                [labels]="[selectedErrorTitle]"
                                [series]="[100]"
                            ></dsh-donut-chart>
                        </div>
                    } @else {
                        @if (chartData?.series?.length) {
                            <dsh-donut-chart
                                [colors]="colors"
                                [labels]="chartData.labels"
                                [series]="chartData.series"
                                class="interactive-errors-chart"
                                (dataSelect)="updateDataSelection($event)"
                            ></dsh-donut-chart>
                        } @else {
                            <div fxFlexFill fxLayoutAlign="center center">{{ t('noData') }}</div>
                        }
                    }
                </div>
            </div>
        } @else {
            <div fxFlexFill fxLayoutAlign="center center">{{ c('httpError') }}</div>
        }
    </dsh-card-content>
</dsh-card>
