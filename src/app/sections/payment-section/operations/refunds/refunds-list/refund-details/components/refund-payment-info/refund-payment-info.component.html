<div
    *transloco="
        let t;
        scope: 'payment-section';
        prefix: 'paymentSection.operations.refunds.paymentInfo'
    "
    fxLayout="column"
    fxLayoutGap="24px"
>
    <div fxLayout fxLayoutAlign="space-between" fxLayoutGap="16px">
        <div class="mat-title-large">{{ t('title') }}</div>
    </div>
    @if (isLoading$ | async) {
        <div
            *transloco="let c; scope: 'components'; prefix: 'components.shared'"
            class="mat-body-medium"
        >
            {{ c('loading') }}
        </div>
    } @else {
        @if (errorOccurred$ | async) {
            <div class="mat-body-medium">
                {{ t('error') }}
            </div>
        } @else {
            @if (payment$ | async; as payment) {
                <dsh-payment-details [payment]="payment"></dsh-payment-details>
            }
        }
    }
</div>
