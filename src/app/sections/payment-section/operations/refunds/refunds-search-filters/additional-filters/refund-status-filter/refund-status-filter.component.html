<ng-container
    *transloco="let t; scope: 'payment-section'; prefix: 'paymentSection.operations.refunds'"
>
    <div fxLayout="column" fxLayoutGap="24px">
        <div class="mat-title-large" fxFlex>{{ t('refundStatus') }}</div>
        <dsh-expandable-radio-group [choices]="statuses" [control]="control" anyResponse fxFlex>
            @for (status of statuses; track status) {
                <ng-template [dshExpandableRadioGroupItem]="status">
                    <span>{{ (refundStatusDict$ | async)?.[status] }}</span>
                </ng-template>
            }
        </dsh-expandable-radio-group>
    </div>
</ng-container>
