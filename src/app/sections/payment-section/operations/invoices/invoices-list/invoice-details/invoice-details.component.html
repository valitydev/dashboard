<div fxLayout="column" fxLayoutGap="24px">
    <dsh-invoice-main-info [invoice]="invoice"></dsh-invoice-main-info>
    @if (isCartAvailable(invoice.cart)) {
        <mat-divider></mat-divider>
        <dsh-invoice-cart-info
            [cart]="invoice.cart"
            [currency]="invoice.currency"
        ></dsh-invoice-cart-info>
    }
    @if (isActionsAvailable(invoice?.status)) {
        <mat-divider></mat-divider>
        <dsh-invoice-actions
            [invoice]="invoice"
            (refreshData)="refreshData.emit()"
        ></dsh-invoice-actions>
    }
    @if ((payments$ | async)?.length) {
        <mat-divider></mat-divider>
        <dsh-invoice-payments [payments]="payments$ | async"></dsh-invoice-payments>
    }
</div>
