<ng-container
    *transloco="
        let payerDetails;
        scope: 'payment-section';
        prefix: 'paymentSection.paymentDetails.payerDetails'
    "
>
    @if (payer.contactInfo.email || payer.contactInfo.phoneNumber) {
        <dsh-details-item [title]="payerDetails('title')">
            <div class="mat-body-medium">
                {{ payer.contactInfo.email || payer.contactInfo.phoneNumber }}
            </div>
        </dsh-details-item>
    }
</ng-container>
