<ng-container
    *transloco="
        let t;
        scope: 'payment-section';
        prefix: 'paymentSection.operations.payments.filter'
    "
>
    <div fxLayout="column" fxLayoutGap="24px">
        <div class="mat-title-large" fxFlex>{{ t('paymentStatus') }}</div>
        <dsh-expandable-radio-group
            [choices]="statuses"
            [control]="control"
            [previewCount]="2"
            anyResponse
            fxFlex
        >
            @for (status of statuses; track status) {
                <ng-template [dshExpandableRadioGroupItem]="status">
                    <span>{{ (paymentStatusDict$ | async)?.[status] }}</span>
                </ng-template>
            }
        </dsh-expandable-radio-group>
    </div>
</ng-container>
