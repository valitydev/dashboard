<ng-container
    *transloco="
        let t;
        scope: 'payment-section';
        prefix: 'paymentSection.operations.payments.filter'
    "
>
    <div fxLayout="column" fxLayoutGap="24px">
        <div class="mat-title-large" fxFlex>{{ t('bankCardPaymentSystem') }}</div>
        <dsh-expandable-radio-group
            [choices]="paymentSystems"
            [control]="control"
            [previewCount]="2"
            anyResponse
            fxFlex
        >
            @for (system of paymentSystems; track system) {
                <ng-template [dshExpandableRadioGroupItem]="system">
                    <span>{{ (bankCardPaymentSystemDict$ | async)?.[system] }}</span>
                </ng-template>
            }
        </dsh-expandable-radio-group>
    </div>
</ng-container>
