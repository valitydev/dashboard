<div
    *transloco="let t; scope: 'payment-section'; prefix: 'paymentSection.shops.shopContract'"
    fxLayout="column"
    fxLayoutGap="24px"
>
    <div class="mat-title-large">{{ t('title') }}</div>

    @let contract = contract$ | async;
    @if (contract) {
        <dsh-contract-details [contract]="contract"></dsh-contract-details>
    }
    @if (errorOccurred$ | async) {
        <div class="mat-body-medium">{{ t('error') }}</div>
    }
</div>
