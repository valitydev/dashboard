<div
    *transloco="let t; scope: 'payment-section'; prefix: 'paymentSection.balances'"
    class="dsh-balances"
    fxLayout="column"
    fxLayoutGap="8px"
>
    <div class="dsh-balances-title">{{ t('title') }}</div>
    @if ((balances$ | async) && (balancesCount$ | async) > 0) {
        @for (balance of balances$ | async; track balance) {
            <div
                [ngClass]="
                    (balancesCount$ | async) <= 3
                        ? 'dsh-balances-balance-lg'
                        : 'dsh-balances-balance-md'
                "
            >
                {{ balance.amount | amountCurrency: balance.currency : 'short' }}
            </div>
        }
    } @else {
        <div class="dsh-balances-balance-lg">--/--</div>
    }
</div>
