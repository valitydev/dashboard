<dsh-base-dialog
    *transloco="let t; scope: 'payment-section'; prefix: 'paymentSection.apiKeys.createDialog'"
    [title]="t('title')"
    (cancel)="closeWithCancellation()"
>
    @if (accessToken) {
        <div>
            <mat-form-field style="width: 100%">
                <mat-label>{{ t('apiKey') }}</mat-label>
                <textarea [value]="accessToken" matInput readonly rows="5"></textarea>
            </mat-form-field>
        </div>
    } @else {
        <div [formGroup]="form" fxLayout="column" fxLayoutGap="24px">
            <mat-form-field style="width: 100%">
                <mat-label>{{ t('keyName') }}</mat-label>
                <input formControlName="name" matInput required />
            </mat-form-field>
            <div class="mat-body-medium">
                {{ t('desc') }}
            </div>
        </div>
    }
    <ng-container dshBaseDialogActions>
        @if (accessToken) {
            <button mat-flat-button (click)="copy()">
                {{ t('copy') }}
            </button>
        } @else {
            <button
                [disabled]="form.invalid || !!(progress$ | async)"
                mat-flat-button
                (click)="confirm()"
            >
                {{ t('confirm') }}
            </button>
        }
    </ng-container>
</dsh-base-dialog>
