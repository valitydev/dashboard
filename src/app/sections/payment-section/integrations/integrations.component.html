<div
    *transloco="let t; scope: 'payment-section'; prefix: 'paymentSection.integrations'"
    fxLayout="column"
    fxLayoutGap="32px"
>
    <nav [tabPanel]="tabPanel" fitInkBarToContent mat-tab-nav-bar style="width: fit-content">
        @for (link of links; track link) {
            @if (link.roles | isAccessAllowed) {
                <a
                    #rla="routerLinkActive"
                    [active]="rla.isActive"
                    [routerLink]="link.path"
                    mat-tab-link
                    routerLinkActive
                >
                    <span>{{ link.label$ | async }}</span>
                </a>
            }
        }
    </nav>
    <mat-tab-nav-panel #tabPanel>
        <router-outlet></router-outlet>
    </mat-tab-nav-panel>
</div>
<dsh-scroll-up></dsh-scroll-up>
