<div fxLayout="column" fxLayoutGap="24px">
    <dsh-report-main-info [report]="report"></dsh-report-main-info>
    <mat-divider></mat-divider>
    @if (report.status === 'created') {
        <dsh-report-files [files]="report.files" [reportID]="report.id"></dsh-report-files>
        <mat-divider></mat-divider>
    }
    @if (report.reportType !== 'provisionOfService') {
        <dsh-report-actions
            [reportID]="report.id"
            (cancelReport)="cancelReport.emit($event)"
        ></dsh-report-actions>
    }
</div>
