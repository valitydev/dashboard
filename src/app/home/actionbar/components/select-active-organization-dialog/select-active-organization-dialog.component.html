<dsh-base-dialog
    *transloco="let t; scope: 'components'; prefix: 'components.select-active-organization-dialog'"
    [title]="t('title')"
    (cancel)="close()"
>
    <div fxLayout="column" fxLayoutGap="8px">
        <dsh-limited-panel
            [hasMore]="(isLoading$ | async) === false && (hasMore$ | async)"
            (showMore)="showMore()"
        >
            <mat-radio-group
                [(ngModel)]="selectedOrganization"
                fxLayout="column"
                fxLayoutGap="24px"
            >
                @for (organization of organizations$ | async; track organization) {
                    <mat-radio-button [value]="organization">
                        {{ organization.name }}
                    </mat-radio-button>
                }
            </mat-radio-group>
        </dsh-limited-panel>
        @if (isLoading$ | async) {
            <dsh-spinner fxFlexAlign="center"></dsh-spinner>
        }
    </div>
    <ng-container dshBaseDialogActions>
        <button
            [disabled]="
                !selectedOrganization ||
                selectedOrganization.id === (contextOrganization$ | async)?.id
            "
            mat-flat-button
            (click)="confirm()"
        >
            {{ t('confirm') }}
        </button>
    </ng-container>
</dsh-base-dialog>
