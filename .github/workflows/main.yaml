name: Main
on:
  push:
    branches: ['master', 'main', 'epic/**']
jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: valitydev/action-frontend/setup-install@v3
      - name: Build
        run: npm run build -- --define "SENTRY_DSN='${SENTRY_DSN}'"
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
      - name: Optimize i18n
        run: npm run i18n:optimize
      - name: Sentry release
        uses: getsentry/action-release@v3
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
        with:
          sourcemaps: ./dist/browser
          environment: ${{ startsWith(github.ref_name, 'epic/') && 'staging' || 'production' }}
          set_commits: skip
      - name: Remove source maps
        run: find dist/browser -type f -name '*.map' -delete
      - name: Deploy image
        uses: valitydev/action-deploy-docker@v2
        with:
          registry-username: ${{ github.actor }}
          registry-access-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set config
        run: |
          printf "$APP_ENV_FILE" > dist/browser/assets/appConfig.json
          printf "$AUTH_ENV_FILE" > dist/browser/assets/authConfig.json
        env:
          APP_ENV_FILE: ${{secrets.APP_CONFIG_CF}}
          AUTH_ENV_FILE: ${{secrets.AUTH_CONFIG_CF}}
      - name: Install Wrangler globally
        run: npm install -g wrangler
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy ./dist/browser --project-name=dashboard
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          packageManager: npm
      - uses: valitydev/action-mattermost-notify@v0.1.4
        with:
          webhook: ${{ secrets.MATTERMOST_WEBHOOK_URL }}
          channel: 'frontend'
          username: 'Frontend'
